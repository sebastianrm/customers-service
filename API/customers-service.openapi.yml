openapi: 3.2.1
info:
  title: Yanki - Customers Service API
  version: '1.0.0'
  description: |
    API REST para la gestión del maestro de clientes de la plataforma bancaria Yanki.

    Este es el único servicio que expone datos de clientes. Los demás microservicios
    se enteran de los cambios mediante eventos Kafka (`customers.registered`,
    `customers.updated`, `customers.deleted`).

    **Características principales:**
    - Alta, consulta, actualización y baja lógica de clientes PERSONAL y ENTERPRISE.
    - Perfiles: STANDARD, VIP (solo PERSONAL), PYME (solo ENTERPRISE).
    - Documento único como identificador principal en toda la plataforma.
    - Cache Redis para consultas por documento y catálogos maestros.
    - Publicación de eventos Kafka tras cada operación CRUD.
    - Validación Jakarta Bean Validation en todos los endpoints.

    **Referencias:**
    - Casos de prueba: `customers-service/test-cases/CASOS_PRUEBA.md` (CP-001 a CP-019)
    - Colección Postman: `customers-service/postman/Yanki-Customers-Service.postman_collection.json`
    - README: `customers-service/README.md`

servers:
  - url: 'http://localhost:8082/'
    description: Servidor local de desarrollo

tags:
  - name: Customers
    description: Operaciones CRUD del maestro de clientes (CP-001 a CP-019)
  - name: Catalogs
    description: Catálogos maestros servidos desde Redis (CP-016)

paths:
  /api/customers:
    post:
      tags: [Customers]
      summary: Registrar un nuevo cliente
      description: |
        Registra un cliente en el maestro y devuelve la contraseña temporal de primer acceso.

        **Reglas de negocio:**
        - `PERSONAL` exige `firstName`, `lastName` y admite `birthDate`.
        - `ENTERPRISE` exige `businessName` y no admite `firstName`, `lastName` ni `birthDate`.
        - `VIP` solo es válido para `PERSONAL`.
        - `PYME` solo es válido para `ENTERPRISE`.
        - `STANDARD` es válido para ambos tipos.
        - El documento (`documentType` + `documentNumber`) debe ser único en toda la plataforma.
        - El cliente se crea con `status = ACTIVE` y `active = true`.
        - Se genera una contraseña temporal de 12 caracteres.
        - Se publica el evento `customers.registered` en Kafka.

        **Casos de prueba:** CP-001, CP-002, CP-003, CP-004, CP-005, CP-006, CP-007, CP-008

      operationId: createCustomer

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            examples:
              personal-standard:
                summary: Cliente personal STANDARD
                description: CP-001: Alta de cliente personal con perfil STANDARD
                value:
                  type: PERSONAL
                  profile: STANDARD
                  documentType: DNI
                  documentNumber: "70123456"
                  firstName: Juan
                  lastName: Perez
                  email: juan.perez@correo.com
                  phone: "+51987654321"
                  address: Av. Javier Prado Este 4200
                  birthDate: "1990-05-20"
              personal-vip:
                summary: Cliente personal VIP
                description: CP-002: Alta de cliente personal con perfil VIP
                value:
                  type: PERSONAL
                  profile: VIP
                  documentType: DNI
                  documentNumber: "70654321"
                  firstName: Maria
                  lastName: Gomez
                  email: maria.gomez@correo.com
                  phone: "+51912345678"
                  address: Jr. Huallaga 150
                  birthDate: "1985-11-10"
              enterprise-pyme:
                summary: Cliente empresarial PYME
                description: CP-003: Alta de cliente empresarial con perfil PYME
                value:
                  type: ENTERPRISE
                  profile: PYME
                  documentType: RUC
                  documentNumber: "20501234567"
                  businessName: Acme S.A.C.
                  email: contacto@acme.com
                  phone: "+5112345678"
                  address: Av. Arequipa 3200

      responses:
        '201':
          description: Cliente creado exitosamente con contraseña temporal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCreatedResponse'
              examples:
                personal-created:
                  summary: Cliente personal creado
                  value:
                    id: 507f1f77bcf86cd799439011
                    type: PERSONAL
                    profile: STANDARD
                    status: ACTIVE
                    documentType: DNI
                    documentNumber: "70123456"
                    firstName: Juan
                    lastName: Perez
                    email: juan.perez@correo.com
                    phone: "+51987654321"
                    address: Av. Javier Prado Este 4200
                    birthDate: "1990-05-20"
                    active: true
                    createdAt: "2026-11-14T10:30:00"
                    updatedAt: "2026-11-14T10:30:00"
                    temporaryPassword: aB3xY9zQ1mNp
        '400':
          description: Error de validación Jakarta — campos obligatorios faltantes o formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                validation-error:
                  summary: Campo obligatorio faltante
                  description: CP-018: PERSONAL sin firstName
                  value:
                    status: 400
                    error: Bad Request
                    code: VALIDATION_ERROR
                    message: La solicitud contiene datos inválidos
                    path: /api/customers
                    details:
                      firstName: El campo firstName es obligatorio para clientes PERSONAL
        '409':
          description: Conflicto — documento ya registrado en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                duplicate-document:
                  summary: Documento duplicado
                  description: CP-004: Intento de registrar un documento ya existente
                  value:
                    status: 409
                    error: Conflict
                    code: CUSTOMER_ALREADY_EXISTS
                    message: Ya existe un cliente con el documento DNI 70123456
                    path: /api/customers
        '422':
          description: Entidad no procesable — perfil inválido para el tipo de cliente o datos inconsistentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
              - invalid-profile:
                  summary: VIP en ENTERPRISE
                  description: CP-008: Perfil VIP no es válido para clientes empresariales
                  value:
                    status: 422
                    error: Unprocessable Entity
                    code: INVALID_CUSTOMER_PROFILE
                    message: El perfil VIP solo es válido para clientes PERSONAL
                    path: /api/customers
                - invalid-data:
                  summary: PERSONAL sin firstName
                  description: CP-005: Cliente PERSONAL sin nombre
                  value:
                    status: 422
                    error: Unprocessable Entity
                    code: INVALID_CUSTOMER_DATA
                    message: El cliente PERSONAL requiere firstName y lastName
                    path: /api/customers

    get:
      tags: [Customers]
      summary: Listar clientes con filtros y paginación
      description: |
        Lista los clientes del maestro con filtros opcionales por tipo, perfil y estado.

        **Paginación:** base cero, página por defecto 0, tamaño por defecto 20 (máximo 100).

        **Casos de prueba:** CP-015

      operationId: listCustomers

      parameters:
        - $ref: '#/components/parameters/type'
        - $ref: '#/components/parameters/profile'
        - $ref: '#/components/parameters/status'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'

      responses:
        '200':
          description: Listado paginado de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
              examples:
                paginated-list:
                  summary: Listado con filtros
                  description: CP-015: Listado de clientes PERSONAL con perfil STANDARD
                  value:
                    content:
                      - id: 507f1f77bcf86cd799439011
                        type: PERSONAL
                        profile: STANDARD
                        status: ACTIVE
                        documentType: DNI
                        documentNumber: "70123456"
                        firstName: Juan
                        lastName: Perez
                        email: juan.perez@correo.com
                        phone: "+51987654321"
                        address: Av. Javier Prado Este 4200
                        birthDate: "1990-05-20"
                        active: true
                        createdAt: "2026-11-14T10:30:00"
                        updatedAt: "2026-11-14T10:30:00"
                    page: 0
                    size: 20
                    totalElements: 1
                    totalPages: 1

  /api/customers/{id}:
    get:
      tags: [Customers]
      summary: Consultar cliente por identificador
      description: |
        Busca un cliente por su identificador único (ID de MongoDB).

        **Casos de prueba:** CP-009

      operationId: getCustomerById

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del cliente (ID de MongoDB)
          schema:
            type: string
            example: 507f1f77bcf86cd799439011

      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customer-found:
                  summary: Cliente encontrado por ID
                  description: CP-009: Consulta exitosa por ID
                  value:
                    id: 507f1f77bcf86cd799439011
                    type: PERSONAL
                    profile: STANDARD
                    status: ACTIVE
                    documentType: DNI
                    documentNumber: "70123456"
                    firstName: Juan
                    lastName: Perez
                    email: juan.perez@correo.com
                    phone: "+51987654321"
                    address: Av. Javier Prado Este 4200
                    birthDate: "1990-05-20"
                    active: true
                    createdAt: "2026-11-14T10:30:00"
                    updatedAt: "2026-11-14T10:30:00"
        '404':
          description: Cliente no encontrado — el ID no existe en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                not-found:
                  summary: Cliente no encontrado
                  value:
                    status: 404
                    error: Not Found
                    code: CUSTOMER_NOT_FOUND
                    message: No existe un cliente con el identificador 507f1f77bcf86cd799439011
                    path: /api/customers/507f1f77bcf86cd799439011

    put:
      tags: [Customers]
      summary: Actualizar datos de un cliente
      description: |
        Actualiza los datos de un cliente existente.

        **Reglas de negocio:**
        - Se aplican las mismas validaciones que en el alta (tipo, perfil, campos obligatorios).
        - `status` puede cambiarse a `ACTIVE` o `BLOCKED`, pero **no** a `DELETED` (usa `DELETE`).
        - `active` puede cambiarse a `true` o `false`.
        - Si se cambia el documento, se valida que no exista ya en otro cliente.
        - Se publica el evento `customers.updated` en Kafka.

        **Casos de prueba:** CP-011, CP-012

      operationId: updateCustomer

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del cliente a actualizar
          schema:
            type: string
            example: 507f1f77bcf86cd799439011

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerRequest'
            examples:
              update-profile:
                summary: Actualizar perfil a VIP
                description: CP-011: Actualización de perfil de STANDARD a VIP
                value:
                  type: PERSONAL
                  profile: VIP
                  documentType: DNI
                  documentNumber: "70123456"
                  firstName: Juan
                  lastName: Perez
                  email: juan.perez@correo.com
                  phone: "+51987654321"
                  address: Av. Javier Prado Este 4200
                  birthDate: "1990-05-20"
                  status: ACTIVE
                  active: true

      responses:
        '200':
          description: Cliente actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customer-updated:
                  summary: Cliente actualizado
                  description: CP-011: Perfil actualizado a VIP
                  value:
                    id: 507f1f77bcf86cd799439011
                    type: PERSONAL
                    profile: VIP
                    status: ACTIVE
                    documentType: DNI
                    documentNumber: "70123456"
                    firstName: Juan
                    lastName: Perez
                    email: juan.perez@correo.com
                    phone: "+51987654321"
                    address: Av. Javier Prado Este 4200
                    birthDate: "1990-05-20"
                    active: true
                    createdAt: "2026-11-14T10:30:00"
                    updatedAt: "2026-11-14T11:00:00"
        '400':
          description: Error de validación Jakarta en el cuerpo de la solicitud
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Cliente no encontrado — el ID no existe en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                not-found:
                  summary: Cliente no encontrado
                  value:
                    status: 404
                    error: Not Found
                    code: CUSTOMER_NOT_FOUND
                    message: No existe un cliente con el identificador 507f1f77bcf86cd799439011
                    path: /api/customers/507f1f77bcf86cd799439011
        '409':
          description: Conflicto — documento duplicado o intento de marcar como DELETED por PUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                status-deleted-by-put:
                  summary: Intento de marcar DELETED por PUT
                  description: CP-012: No se puede asignar status=DELETED mediante PUT
                  value:
                    status: 409
                    error: Conflict
                    code: INVALID_CUSTOMER_STATUS
                    message: No se puede asignar el estado DELETED mediante actualización; use DELETE
                    path: /api/customers/507f1f77bcf86cd799439011
        '422':
          description: Entidad no procesable — perfil, datos o documento inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

    delete:
      tags: [Customers]
      summary: Eliminar lógicamente un cliente
      description: |
        Marca el cliente como `DELETED` y `active = false` sin borrarlo de MongoDB.

        **Reglas de negocio:**
        - Un cliente ya eliminado responde con `CUSTOMER_ALREADY_DELETED` (409).
        - Se publica el evento `customers.deleted` en Kafka.

        **Casos de prueba:** CP-013, CP-014

      operationId: deleteCustomer

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único del cliente a eliminar
          schema:
            type: string
            example: 507f1f77bcf86cd799439011

      responses:
        '204':
          description: Cliente eliminado lógicamente — sin cuerpo de respuesta
        '404':
          description: Cliente no encontrado — el ID no existe en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                not-found:
                  summary: Cliente no encontrado
                  value:
                    status: 404
                    error: Not Found
                    code: CUSTOMER_NOT_FOUND
                    message: No existe un cliente con el identificador 507f1f77bcf86cd799439011
                    path: /api/customers/507f1f77bcf86cd799439011
        '409':
          description: Cliente ya eliminado lógicamente — no se puede eliminar dos veces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                already-deleted:
                  summary: Cliente ya eliminado
                  description: CP-014: Intento de eliminar un cliente ya DELETED
                  value:
                    status: 409
                    error: Conflict
                    code: CUSTOMER_ALREADY_DELETED
                    message: El cliente ya fue eliminado lógicamente
                    path: /api/customers/507f1f77bcf86cd799439011

  /api/customers/document/{documentType}/{documentNumber}:
    get:
      tags: [Customers]
      summary: Consultar cliente por tipo y número de documento
      description: |
        Busca un cliente por su tipo y número de documento utilizando cache Redis.

        **Cache:** La respuesta se cachea en Redis con la clave `customer:doc:{type}:{number}`
        y un TTL de 30 minutos.

        **Casos de prueba:** CP-010

      operationId: getCustomerByDocument

      parameters:
        - name: documentType
          in: path
          required: true
          description: Tipo de documento del cliente
          schema:
            type: string
            enum: [DNI, CEX, PASSPORT, RUC]
            example: DNI
        - name: documentNumber
          in: path
          required: true
          description: Número de documento del cliente
          schema:
            type: string
            example: "70123456"

      responses:
        '200':
          description: Cliente encontrado por documento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
              examples:
                customer-by-doc:
                  summary: Cliente encontrado por documento
                  description: CP-010: Consulta exitosa por documento con cache Redis
                  value:
                    id: 507f1f77bcf86cd799439011
                    type: PERSONAL
                    profile: STANDARD
                    status: ACTIVE
                    documentType: DNI
                    documentNumber: "70123456"
                    firstName: Juan
                    lastName: Perez
                    email: juan.perez@correo.com
                    phone: "+51987654321"
                    address: Av. Javier Prado Este 4200
                    birthDate: "1990-05-20"
                    active: true
                    createdAt: "2026-11-14T10:30:00"
                    updatedAt: "2026-11-14T10:30:00"
        '404':
          description: Cliente no encontrado — el documento no existe en el sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                not-found:
                  summary: Documento no encontrado
                  value:
                    status: 404
                    error: Not Found
                    code: CUSTOMER_NOT_FOUND
                    message: No existe un cliente con el documento DNI 70999999
                    path: /api/customers/document/DNI/70999999

  /api/customers/catalogs:
    get:
      tags: [Catalogs]
      summary: Obtener catálogos maestros
      description: |
        Devuelve los catálogos maestros de tipos de cliente, perfiles y tipos de documento.

        **Cache:** Los catálogos se sirven desde Redis con la clave `customer:catalogs`
        y un TTL de 60 minutos.

        **Casos de prueba:** CP-016

      operationId: getCatalogs

      responses:
        '200':
          description: Catálogos maestros de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCatalogsResponse'
              examples:
                catalogs:
                  summary: Catálogos maestros completos
                  description: CP-016: Catálogos de tipos de cliente, perfiles y documentos
                  value:
                    customerTypes:
                      - PERSONAL
                      - ENTERPRISE
                    profiles:
                      - STANDARD
                      - VIP
                      - PYME
                    documentTypes:
                      - DNI
                      - CEX
                      - PASSPORT
                      - RUC

components:
  parameters:
    type:
      name: type
      in: query
      required: false
      description: Filtrar por tipo de cliente (PERSONAL = persona natural, ENTERPRISE = persona jurídica)
      schema:
        type: string
        enum: [PERSONAL, ENTERPRISE]
        example: PERSONAL

    profile:
      name: profile
      in: query
      required: false
      description: Filtrar por perfil del cliente (STANDARD = genérico, VIP = preferente personal, PYME = empresa)
      schema:
        type: string
        enum: [STANDARD, VIP, PYME]
        example: STANDARD

    status:
      name: status
      in: query
      required: false
      description: Filtrar por estado del cliente (ACTIVE = habilitado, BLOCKED = bloqueado, DELETED = eliminado lógicamente)
      schema:
        type: string
        enum: [ACTIVE, BLOCKED, DELETED]
        example: ACTIVE

    page:
      name: page
      in: query
      required: false
      description: Número de página (base cero, comienza en 0)
      schema:
        type: integer
        default: 0
        minimum: 0
        example: 0

    size:
      name: size
      in: query
      required: false
      description: Cantidad de elementos por página (máximo 100)
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
        example: 20

  schemas:
    CustomerRequest:
      type: object
      description: |
        Datos de entrada para registrar o actualizar un cliente.

        **Campos obligatorios:** `type`, `profile`, `documentType`, `documentNumber`, `email`.
        **Campos condicionales:**
        - `PERSONAL`: exige `firstName`, `lastName`; admite `birthDate`.
        - `ENTERPRISE`: exige `businessName`; no admite `firstName`, `lastName` ni `birthDate`.
        **Campos solo en PUT:** `status`, `active` (se ignoran en POST).
      properties:
        type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          description: Tipo de cliente — PERSONAL (persona natural) o ENTERPRISE (persona jurídica)
          example: PERSONAL
        profile:
          type: string
          enum: [STANDARD, VIP, PYME]
          description: Perfil del cliente — STANDARD (genérico), VIP (solo PERSONAL), PYME (solo ENTERPRISE)
          example: STANDARD
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
          description: Tipo de documento — DNI (Documento Nacional de Identidad), CEX (Carnet de Extranjería), PASSPORT (Pasaporte), RUC (Registro Único de Contribuyentes)
          example: DNI
        documentNumber:
          type: string
          description: Número de documento único en toda la plataforma
          example: "70123456"
        businessName:
          type: string
          description: Razón social del cliente empresarial (obligatorio si type = ENTERPRISE)
          example: Acme S.A.C.
        firstName:
          type: string
          description: Nombres del cliente personal (obligatorio si type = PERSONAL)
          example: Juan
        lastName:
          type: string
          description: Apellidos del cliente personal (obligatorio si type = PERSONAL)
          example: Perez
        email:
          type: string
          format: email
          description: Correo electrónico del cliente (obligatorio, formato válido)
          example: juan.perez@correo.com
        phone:
          type: string
          description: Teléfono de contacto del cliente
          example: "+51987654321"
        address:
          type: string
          description: Dirección física del cliente
          example: Av. Javier Prado Este 4200
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento del cliente personal (solo PERSONAL, formato ISO-8601)
          example: "1990-05-20"
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
          description: Estado deseado del cliente — solo se aplica en PUT (no en POST). No se puede asignar DELETED por PUT.
          example: ACTIVE
        active:
          type: boolean
          description: Indicador de operación — solo se aplica en PUT (no en POST)
          example: true
      required: [type, profile, documentType, documentNumber, email]

    CustomerResponse:
      type: object
      description: |
        Datos completos de un cliente del maestro.

        Nunca incluye la contraseña temporal: esa credencial solo se devuelve
        en la respuesta de creación (CustomerCreatedResponse).
      properties:
        id:
          type: string
          description: Identificador único del cliente (ID de MongoDB)
          example: 507f1f77bcf86cd799439011
        type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          description: Tipo de cliente
          example: PERSONAL
        profile:
          type: string
          enum: [STANDARD, VIP, PYME]
          description: Perfil del cliente
          example: STANDARD
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
          description: Estado actual del cliente
          example: ACTIVE
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
          description: Tipo de documento
          example: DNI
        documentNumber:
          type: string
          description: Número de documento
          example: "70123456"
        businessName:
          type: string
          description: Razón social (solo clientes empresariales, null para PERSONAL)
          example: Acme S.A.C.
        firstName:
          type: string
          description: Nombres (solo clientes personales, null para ENTERPRISE)
          example: Juan
        lastName:
          type: string
          description: Apellidos (solo clientes personales, null para ENTERPRISE)
          example: Perez
        email:
          type: string
          format: email
          description: Correo electrónico
          example: juan.perez@correo.com
        phone:
          type: string
          description: Teléfono de contacto
          example: "+51987654321"
        address:
          type: string
          description: Dirección física
          example: Av. Javier Prado Este 4200
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento (solo clientes personales, null para ENTERPRISE)
          example: "1990-05-20"
        active:
          type: boolean
          description: Indicador de operación (true = habilitado, false = deshabilitado)
          example: true
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de creación del registro (ISO-8601)
          example: "2026-11-14T10:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Fecha y hora de la última actualización (ISO-8601)
          example: "2026-11-14T11:00:00"

    CustomerCreatedResponse:
      type: object
      description: |
        Respuesta de la creación de un cliente.

        Incluye todos los campos de CustomerResponse más la contraseña temporal
        que el cliente deberá cambiar en su primer acceso. Esta credencial no se
        devuelve en ninguna otra operación.
      properties:
        id:
          type: string
          description: Identificador único del cliente creado (ID de MongoDB)
          example: 507f1f77bcf86cd799439011
        type:
          type: string
          enum: [PERSONAL, ENTERPRISE]
          description: Tipo de cliente
          example: PERSONAL
        profile:
          type: string
          enum: [STANDARD, VIP, PYME]
          description: Perfil del cliente
          example: STANDARD
        status:
          type: string
          enum: [ACTIVE, BLOCKED, DELETED]
          description: Estado del cliente (siempre ACTIVE al crear)
          example: ACTIVE
        documentType:
          type: string
          enum: [DNI, CEX, PASSPORT, RUC]
          description: Tipo de documento
          example: DNI
        documentNumber:
          type: string
          description: Número de documento
          example: "70123456"
        businessName:
          type: string
          description: Razón social (solo clientes empresariales)
          example: Acme S.A.C.
        firstName:
          type: string
          description: Nombres (solo clientes personales)
          example: Juan
        lastName:
          type: string
          description: Apellidos (solo clientes personales)
          example: Perez
        email:
          type: string
          format: email
          description: Correo electrónico
          example: juan.perez@correo.com
        phone:
          type: string
          description: Teléfono de contacto
          example: "+51987654321"
        address:
          type: string
          description: Dirección física
          example: Av. Javier Prado Este 4200
        birthDate:
          type: string
          format: date
          description: Fecha de nacimiento (solo clientes personales)
          example: "1990-05-20"
        active:
          type: boolean
          description: Indicador de operación (siempre true al crear)
          example: true
        createdAt:
          type: string
          format: date-time
          description: Fecha y hora de creación (ISO-8601)
          example: "2026-11-14T10:30:00"
        updatedAt:
          type: string
          format: date-time
          description: Fecha y hora de la última actualización (ISO-8601)
          example: "2026-11-14T10:30:00"
        temporaryPassword:
          type: string
          description: Contraseña temporal de 12 caracteres generada para el primer acceso
          example: aB3xY9zQ1mNp

    CustomerCatalogsResponse:
      type: object
      description: Catálogos maestros servidos desde Redis (TTL 60 minutos)
      properties:
        customerTypes:
          type: array
          description: Tipos de cliente soportados por la plataforma
          items:
            type: string
            enum: [PERSONAL, ENTERPRISE]
          example: [PERSONAL, ENTERPRISE]
        profiles:
          type: array
          description: Perfiles de cliente soportados
          items:
            type: string
            enum: [STANDARD, VIP, PYME]
          example: [STANDARD, VIP, PYME]
        documentTypes:
          type: array
          description: Tipos de documento de identidad soportados
          items:
            type: string
            enum: [DNI, CEX, PASSPORT, RUC]
          example: [DNI, CEX, PASSPORT, RUC]

    PageResponse:
      type: object
      description: |
        Respuesta paginada estándar de la API.

        Sustituye a `org.springframework.data.domain.Page` para no exponer
        tipos internos del framework en el contrato público.
      properties:
        content:
          type: array
          description: Elementos de la página actual
          items:
            $ref: '#/components/schemas/CustomerResponse'
        page:
          type: integer
          description: Número de página actual (base cero)
          example: 0
        size:
          type: integer
          description: Cantidad de elementos por página
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Cantidad total de elementos que cumplen el filtro
          example: 150
        totalPages:
          type: integer
          description: Cantidad total de páginas calculada
          example: 8

    ApiError:
      type: object
      description: |
        Cuerpo estándar de error de la API.

        Todos los errores devuelven esta estructura con un código de negocio
        (`code`) que identifica el tipo de error de forma estable.

        **Códigos de negocio:**
        | Código | HTTP | Descripción |
        |--------|------|-------------|
        | `CUSTOMER_ALREADY_EXISTS` | 409 | Documento ya registrado |
        | `CUSTOMER_ALREADY_DELETED` | 409 | Cliente ya eliminado lógicamente |
        | `CUSTOMER_NOT_FOUND` | 404 | Cliente no encontrado |
        | `INVALID_CUSTOMER_PROFILE` | 422 | Perfil inválido para el tipo de cliente |
        | `INVALID_CUSTOMER_DATA` | 422 | Datos inconsistentes con el tipo de cliente |
        | `INVALID_CUSTOMER_STATUS` | 422 | Estado no asignable por PUT |
        | `INVALID_DOCUMENT_TYPE` | 422 | Tipo de documento no soportado |
        | `VALIDATION_ERROR` | 400 | Error de validación Jakarta Bean Validation |
        | `INVALID_INPUT` | 400 | Entrada mal formada (enum inválido, JSON inválido) |
        | `INTERNAL_ERROR` | 500 | Error inesperado del servidor |
      properties:
        timestamp:
          type: string
          format: date-time
          description: Momento en que se generó el error (ISO-8601 instant)
          example: "2026-11-14T10:30:00Z"
        status:
          type: integer
          description: Código de estado HTTP
          example: 409
        error:
          type: string
          description: Razón del estado HTTP
          example: Conflict
        code:
          type: string
          description: Código de negocio estable que identifica el error
          example: CUSTOMER_ALREADY_EXISTS
        message:
          type: string
          description: Mensaje descriptivo legible del error
          example: Ya existe un cliente con el documento DNI 70123456
        path:
          type: string
          description: Ruta de la solicitud que originó el error
          example: /api/customers
        details:
          type: object
          description: Detalles adicionales del error (por ejemplo, campos con error de validación)
          additionalProperties: true
          example:
            firstName: El campo firstName es obligatorio para clientes PERSONAL
